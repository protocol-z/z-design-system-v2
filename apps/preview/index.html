<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="refresh" content="0; url=./v2.html" />
  <link rel="canonical" href="./v2.html" />
  <title>Z Design System v2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../packages/ui/src/styles/tokens.css" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100vh;
      background: var(--zds-bg);
      color: var(--zds-text);
      font-family: var(--zds-font-body);
    }
    body {
      display: grid;
      place-items: center;
      padding: 32px;
    }
    main {
      width: min(100%, 640px);
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 18px;
      padding: 8px 12px;
      border: 1px solid var(--zds-line);
      border-radius: var(--zds-radius-pill);
      background: rgba(255, 255, 255, 0.64);
      color: var(--zds-text-secondary);
      font-size: var(--zds-body-s);
      box-shadow: var(--zds-shadow-glass);
    }
    .eyebrow::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--zds-mint-500);
    }
    h1 {
      margin: 0 0 16px;
      max-width: 12ch;
      font-family: var(--zds-font-display);
      font-size: var(--zds-display-m);
      line-height: 0.96;
      letter-spacing: -0.035em;
      font-weight: 500;
    }
    p {
      margin: 0 0 28px;
      max-width: 54ch;
      color: var(--zds-text-secondary);
      font-size: var(--zds-body-m);
      line-height: 1.6;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 0 18px;
      border: 1px solid var(--zds-line);
      border-radius: var(--zds-radius-pill);
      background: var(--zds-paper);
      color: var(--zds-text);
      font-weight: 500;
      text-decoration: none;
      box-shadow: var(--zds-shadow-plate);
    }
    a:hover {
      background: var(--zds-mist);
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Z Design System v2</p>
    <h1>Opening the active v2 reference.</h1>
    <p>
      The default preview now points to the v2 token and component system used by
      Z Scan, Z Inference, and Z Stake.
    </p>
    <div class="links">
      <a href="./v2.html">Open v2 visual reference</a>
      <a href="./enterprise.html">Open Enterprise foundation</a>
      <a href="./scan.html">Open scanner component reference</a>
      <a href="./scan-restyle.html">Open scanner restyle reference</a>
    </div>
  </main>
</body>
</html>
